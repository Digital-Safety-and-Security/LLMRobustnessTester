[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robustness-testing"
version = "0.1.0"
description = "Abstract contracts for robustness testing of generative AI systems and other systems under test."
requires-python = ">=3.11"
readme = "README.md"
authors = [
  { name = "Robustness Testing Contributors" }
]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
